version: '3.8'

services:
  war-bloop:
    build:
      context: .
      dockerfile: Dockerfile
    image: war-bloop-v1:latest
    container_name: war-bloop-v1
    hostname: war-bloop
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web Dashboard
      - "8080:8080"   # Phishing Server
    volumes:
      - war-bloop-data:/app/.war_bloop_v1
      - war-bloop-reports:/app/war_bloop_reports
      - ./config:/app/config:ro
    environment:
      - TZ=UTC
      - WAR_BLOOP_DEBUG=false
      - WAR_BLOOP_LOG_LEVEL=INFO
    networks:
      - war-bloop-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for session management
  redis:
    image: redis:7-alpine
    container_name: war-bloop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - war-bloop-network
    command: redis-server --appendonly yes

  # Optional: PostgreSQL for enhanced data storage
  postgres:
    image: postgres:16-alpine
    container_name: war-bloop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=warbloop
      - POSTGRES_PASSWORD=warbloop_secret
      - POSTGRES_DB=warbloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - war-bloop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warbloop"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  war-bloop-network:
    driver: bridge

volumes:
  war-bloop-data:
    driver: local
  war-bloop-reports:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
